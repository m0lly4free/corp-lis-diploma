<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка сервера — АО «Корпорация ЛИС»</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'Roboto', sans-serif; 
            line-height: 1.6; 
            color: #2d3748; 
            background: #f8fafc; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
        }
        .error-message {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .support-info {
            background: #fee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #e53e3e;
        }
        .home-link {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .home-link:hover {
            background: #0052a3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="error-title">Внутренняя ошибка сервера</h1>
        <p class="error-message">
            Произошла непредвиденная ошибка при обработке вашего запроса. 
            Наши специалисты уже работают над решением проблемы.
        </p>
        <div class="support-info">
            Если ошибка повторяется, пожалуйста, свяжитесь с технической поддержкой.
        </div>
        <a href="/" class="home-link">На главную страницу</a>
    </div>
</body>
</html>
