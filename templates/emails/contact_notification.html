<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новое обращение</title>
</head>
<body>
    <h1>Новое обращение с формы контактов</h1>
    
    <p><strong>Имя:</strong> {{ name }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Телефон:</strong> {{ phone }}</p>
    <p><strong>Сообщение:</strong></p>
    <p>{{ message }}</p>
    
    <p><strong>Дата отправки:</strong> {{ created_at }}</p>
    
    <hr>
    <p>Это автоматическое уведомление от системы корпорации ЛИС.</p>
</body>
</html>
